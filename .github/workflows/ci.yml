name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: ubuntu-24.04
        - os: ubuntu-26.04
        - os: macOS-latest
 
    name: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with: {submodules: recursive}

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ matrix.os }}
        max-size: "2G"

    - name: Build with make
      run: |
        ./make_all.sh

    - name: Build with CMake
      run: |
        INSTALL_DIR="$PWD/install"
        cmake -B build -S . -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
          -DCMAKE_INSTALL_RPATH_USE_LINK_PATH:BOOL=TRUE \
          -DCMAKE_INSTALL_RPATH:PATH="\${INSTALL_DIR}/lib"
        cmake --build build --config Release
        cmake --install build
    
    - name: Build external
      run: |
        cd test_external
        # find location of CMake file independent of version
        # (line is only ok if there's only one!)
        location=`echo ../install/lib/cmake/SimSET-*`
        cmake -B build -S . -DSimSET_DIR=${location}

